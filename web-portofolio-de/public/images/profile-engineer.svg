<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <filter id="glowAvatar" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular Base Container -->
  <circle cx="200" cy="200" r="190" fill="url(#avatarBg)" stroke="#1E293B" stroke-width="3"/>
  <circle cx="200" cy="200" r="190" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="10,15" stroke-opacity="0.4"/>

  <!-- Ambient Light -->
  <circle cx="200" cy="180" r="110" fill="#38BDF8" fill-opacity="0.1" filter="url(#glowAvatar)"/>

  <!-- Geometric Data Nodes Network Background -->
  <g stroke="#334155" stroke-width="1" stroke-opacity="0.5">
    <line x1="120" y1="120" x2="200" y2="80"/>
    <line x1="200" y1="80" x2="280" y2="120"/>
    <line x1="280" y1="120" x2="290" y2="220"/>
    <line x1="120" y1="120" x2="110" y2="220"/>
    <line x1="110" y1="220" x2="200" y2="290"/>
    <line x1="290" y1="220" x2="200" y2="290"/>
  </g>
  <circle cx="120" cy="120" r="4" fill="#38BDF8"/>
  <circle cx="200" cy="80" r="5" fill="#818CF8"/>
  <circle cx="280" cy="120" r="4" fill="#38BDF8"/>
  <circle cx="110" cy="220" r="4" fill="#10B981"/>
  <circle cx="290" cy="220" r="4" fill="#10B981"/>
  <circle cx="200" cy="290" r="5" fill="#38BDF8"/>

  <!-- Stylized Engineer Monogram / Terminal Silhouette -->
  <!-- Laptop / Terminal Base -->
  <path d="M 120 270 L 280 270 L 295 285 L 105 285 Z" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="135" y="170" width="130" height="95" rx="8" fill="#090D16" stroke="#334155" stroke-width="1.5"/>
  <!-- Code lines on screen -->
  <rect x="150" y="185" width="40" height="4" rx="2" fill="#38BDF8"/>
  <rect x="195" y="185" width="50" height="4" rx="2" fill="#818CF8"/>
  <rect x="150" y="197" width="75" height="4" rx="2" fill="#10B981"/>
  <rect x="150" y="209" width="60" height="4" rx="2" fill="#94A3B8"/>
  <rect x="150" y="221" width="30" height="4" rx="2" fill="#38BDF8"/>
  <rect x="185" y="221" width="45" height="4" rx="2" fill="#F59E0B"/>
  <rect x="150" y="233" width="70" height="4" rx="2" fill="#34D399"/>

  <!-- Stylized Developer Silhouette Head & Shoulders -->
  <circle cx="200" cy="125" r="32" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <path d="M 155 168 C 155 145 175 140 200 140 C 225 140 245 145 245 168 Z" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>

  <!-- Data Flow Rings Orbiting -->
  <ellipse cx="200" cy="200" rx="160" ry="60" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="4,8" stroke-opacity="0.4" transform="rotate(-20 200 200)"/>
  <ellipse cx="200" cy="200" rx="160" ry="60" fill="none" stroke="#818CF8" stroke-width="1.2" stroke-dasharray="6,10" stroke-opacity="0.4" transform="rotate(25 200 200)"/>

  <!-- Personal Brand Badge -->
  <g transform="translate(130, 315)">
    <rect width="140" height="30" rx="15" fill="#090D16" stroke="#38BDF8" stroke-width="1.5" filter="url(#glowAvatar)"/>
    <text x="70" y="20" text-anchor="middle" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">IRFAN W. // DE</text>
  </g>
</svg>

