<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradStock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGradStock" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <pattern id="gridFin" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGradStock)"/>
  <rect width="800" height="450" fill="url(#gridFin)"/>

  <!-- Top Airflow DAG Header Bar -->
  <g transform="translate(40, 24)">
    <rect width="720" height="42" rx="8" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
    <circle cx="20" cy="21" r="4.5" fill="#EF4444"/>
    <circle cx="36" cy="21" r="4.5" fill="#F59E0B"/>
    <circle cx="52" cy="21" r="4.5" fill="#10B981"/>
    <text x="75" y="25" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">airflow://market_ingestion (task: run_market_ingestion)</text>
    <rect x="535" y="9" width="170" height="24" rx="4" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-width="1"/>
    <text x="620" y="25" text-anchor="middle" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">SENIN–JUMAT 17:30 WIB</text>
  </g>

  <!-- Left Side: Ingestion & Pipeline Configuration -->
  <g transform="translate(40, 80)">
    <rect width="215" height="260" rx="10" fill="url(#cardGradStock)" stroke="#1E293B" stroke-width="1.2"/>
    <text x="18" y="28" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">ETL PIPELINE FLOW</text>
    
    <!-- Step 1: yfinance Box -->
    <rect x="15" y="44" width="185" height="46" rx="6" fill="#090D16" stroke="#334155" stroke-width="1"/>
    <text x="26" y="62" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600">1. Extract (yfinance)</text>
    <text x="26" y="78" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9">20 Kode Saham Indonesia</text>

    <!-- Step 2: Transform & Clean -->
    <rect x="15" y="98" width="185" height="46" rx="6" fill="#090D16" stroke="#334155" stroke-width="1"/>
    <text x="26" y="116" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600">2. Transform &amp; Clean</text>
    <text x="26" y="132" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="8.5">Filter Null Close &amp; Format</text>

    <!-- Step 3: Validate & Load -->
    <rect x="15" y="152" width="185" height="46" rx="6" fill="#090D16" stroke="#334155" stroke-width="1"/>
    <text x="26" y="170" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600">3. Validate &amp; Load</text>
    <text x="26" y="186" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="8.5">PostgreSQL 16 Database ✓</text>

    <!-- Environment Tag -->
    <rect x="15" y="206" width="185" height="38" rx="6" fill="#0C1B33" stroke="#1D4ED8" stroke-width="0.8"/>
    <text x="107" y="222" text-anchor="middle" fill="#93C5FD" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">Docker Compose Env</text>
    <text x="107" y="235" text-anchor="middle" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="8">Webserver · Scheduler · LocalExec</text>
  </g>

  <!-- Right Side: Indonesian Equities Candlestick Chart Preview -->
  <g transform="translate(275, 80)">
    <rect width="485" height="260" rx="10" fill="#090D16" stroke="#1E293B" stroke-width="1.2"/>
    
    <!-- Chart Header -->
    <text x="20" y="28" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12" font-weight="700">INDONESIA EQUITIES (20 TICKERS - 1D OHLC)</text>
    <text x="400" y="28" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">IHSG DATASET ▲</text>
    <line x1="20" y1="38" x2="465" y2="38" stroke="#1E293B" stroke-width="1"/>

    <!-- Grid Horizontal Lines -->
    <line x1="35" y1="75" x2="455" y2="75" stroke="#1E293B" stroke-dasharray="4,4"/>
    <line x1="35" y1="120" x2="455" y2="120" stroke="#1E293B" stroke-dasharray="4,4"/>
    <line x1="35" y1="165" x2="455" y2="165" stroke="#1E293B" stroke-dasharray="4,4"/>

    <!-- Candlesticks -->
    <!-- Bar 1 -->
    <line x1="65" y1="125" x2="65" y2="170" stroke="#10B981" stroke-width="1.5"/>
    <rect x="58" y="135" width="14" height="25" rx="2" fill="#10B981"/>

    <!-- Bar 2 -->
    <line x1="105" y1="130" x2="105" y2="180" stroke="#F43F5E" stroke-width="1.5"/>
    <rect x="98" y="140" width="14" height="28" rx="2" fill="#F43F5E"/>

    <!-- Bar 3 -->
    <line x1="145" y1="105" x2="145" y2="160" stroke="#10B981" stroke-width="1.5"/>
    <rect x="138" y="115" width="14" height="35" rx="2" fill="#10B981"/>

    <!-- Bar 4 -->
    <line x1="185" y1="90" x2="185" y2="145" stroke="#10B981" stroke-width="1.5"/>
    <rect x="178" y="100" width="14" height="30" rx="2" fill="#10B981"/>

    <!-- Bar 5 -->
    <line x1="225" y1="95" x2="225" y2="140" stroke="#F43F5E" stroke-width="1.5"/>
    <rect x="218" y="105" width="14" height="22" rx="2" fill="#F43F5E"/>

    <!-- Bar 6 -->
    <line x1="265" y1="75" x2="265" y2="130" stroke="#10B981" stroke-width="1.5"/>
    <rect x="258" y="85" width="14" height="35" rx="2" fill="#10B981"/>

    <!-- Bar 7 -->
    <line x1="305" y1="60" x2="305" y2="115" stroke="#10B981" stroke-width="1.5"/>
    <rect x="298" y="70" width="14" height="35" rx="2" fill="#10B981"/>

    <!-- Bar 8 -->
    <line x1="345" y1="50" x2="345" y2="100" stroke="#10B981" stroke-width="1.5"/>
    <rect x="338" y="58" width="14" height="32" rx="2" fill="#10B981"/>

    <!-- Bar 9 -->
    <line x1="385" y1="60" x2="385" y2="110" stroke="#F43F5E" stroke-width="1.5"/>
    <rect x="378" y="68" width="14" height="24" rx="2" fill="#F43F5E"/>

    <!-- Bar 10 -->
    <line x1="425" y1="45" x2="425" y2="90" stroke="#10B981" stroke-width="1.5"/>
    <rect x="418" y="50" width="14" height="30" rx="2" fill="#10B981"/>

    <!-- SMA Trend Overlay Line -->
    <path d="M 65 155 Q 145 135 225 120 T 345 80 T 425 65" fill="none" stroke="#38BDF8" stroke-width="2.5"/>

    <!-- Bottom Volume Bars Sub-Chart -->
    <rect x="58" y="215" width="14" height="25" fill="#1E293B"/>
    <rect x="98" y="222" width="14" height="18" fill="#1E293B"/>
    <rect x="138" y="205" width="14" height="35" fill="#10B981" fill-opacity="0.6"/>
    <rect x="178" y="210" width="14" height="30" fill="#10B981" fill-opacity="0.6"/>
    <rect x="218" y="225" width="14" height="15" fill="#1E293B"/>
    <rect x="258" y="200" width="14" height="40" fill="#10B981" fill-opacity="0.6"/>
    <rect x="298" y="195" width="14" height="45" fill="#10B981" fill-opacity="0.6"/>
    <rect x="338" y="190" width="14" height="50" fill="#10B981" fill-opacity="0.7"/>
    <rect x="378" y="220" width="14" height="20" fill="#1E293B"/>
    <rect x="418" y="185" width="14" height="55" fill="#10B981" fill-opacity="0.8"/>
  </g>

  <!-- Bottom Metric Strip -->
  <g transform="translate(40, 356)">
    <rect width="720" height="58" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    
    <g transform="translate(35, 18)">
      <text x="0" y="10" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9.5" text-transform="uppercase">EMITEN SAHAM</text>
      <text x="0" y="28" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="13" font-weight="700">20 Saham Indonesia</text>
    </g>

    <line x1="230" y1="10" x2="230" y2="48" stroke="#1E293B" stroke-width="1"/>

    <g transform="translate(265, 18)">
      <text x="0" y="10" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9.5" text-transform="uppercase">DATA PROSES &amp; DURASI</text>
      <text x="0" y="28" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">480 Record (~9 Detik)</text>
    </g>

    <line x1="490" y1="10" x2="490" y2="48" stroke="#1E293B" stroke-width="1"/>

    <g transform="translate(525, 18)">
      <text x="0" y="10" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9.5" text-transform="uppercase">STORAGE &amp; CONTAINER</text>
      <text x="0" y="28" fill="#818CF8" font-family="'Inter', sans-serif" font-size="13" font-weight="700">PostgreSQL 16 &amp; Docker</text>
    </g>
  </g>
</svg>