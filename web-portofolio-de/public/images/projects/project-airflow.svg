<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16"/>
      <stop offset="50%" stop-color="#0B1324"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>

    <pattern id="gridAirflow" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.5"/>
    </pattern>

    <filter id="glowAirflow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad4)"/>
  <rect width="800" height="450" fill="url(#gridAirflow)"/>

  <!-- Top Header Bar -->
  <g transform="translate(40, 25)">
    <rect width="720" height="42" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
    <circle cx="25" cy="21" r="5" fill="#EF4444"/>
    <circle cx="42" cy="21" r="5" fill="#F59E0B"/>
    <circle cx="59" cy="21" r="5" fill="#10B981"/>
    <text x="85" y="26" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500">airflow_grid_view://dag_resilient_ingest_orchestration</text>
    <rect x="580" y="10" width="125" height="22" rx="11" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
    <text x="642" y="25" text-anchor="middle" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">30+ ACTIVE DAGS</text>
  </g>

  <!-- DAG Flow Visualization -->
  <g transform="translate(50, 95)">
    
    <!-- Flow Connector Lines -->
    <path d="M 130 90 L 190 90" stroke="#10B981" stroke-width="3"/>
    <polygon points="185,86 195,90 185,94" fill="#10B981"/>

    <path d="M 330 90 L 390 90" stroke="#10B981" stroke-width="3"/>
    <polygon points="385,86 395,90 385,94" fill="#10B981"/>

    <path d="M 530 90 L 590 90" stroke="#38BDF8" stroke-width="3"/>
    <polygon points="585,86 595,90 585,94" fill="#38BDF8"/>

    <!-- Task 1: Async S3 Key Sensor -->
    <g transform="translate(0, 40)">
      <rect width="130" height="100" rx="10" fill="#090D16" stroke="#818CF8" stroke-width="1.5"/>
      <rect x="10" y="10" width="110" height="20" rx="4" fill="#4F46E5" fill-opacity="0.2"/>
      <text x="65" y="24" text-anchor="middle" fill="#A5B4FC" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">TASK 1: SENSOR</text>
      
      <text x="65" y="55" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="600">S3KeySensor</text>
      <text x="65" y="70" text-anchor="middle" fill="#818CF8" font-family="'JetBrains Mono', monospace" font-size="9">Async Deferrable</text>

      <rect x="25" y="80" width="80" height="15" rx="7" fill="#10B981" fill-opacity="0.2"/>
      <text x="65" y="91" text-anchor="middle" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">SUCCESS</text>
    </g>

    <!-- Task 2: Ingest & Pre-Validation -->
    <g transform="translate(200, 40)">
      <rect width="130" height="100" rx="10" fill="#090D16" stroke="#10B981" stroke-width="1.5"/>
      <rect x="10" y="10" width="110" height="20" rx="4" fill="#059669" fill-opacity="0.2"/>
      <text x="65" y="24" text-anchor="middle" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">TASK 2: EXTRACT</text>
      
      <text x="65" y="55" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Python Ingestor</text>
      <text x="65" y="70" text-anchor="middle" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9">Chunked Streaming</text>

      <rect x="25" y="80" width="80" height="15" rx="7" fill="#10B981" fill-opacity="0.2"/>
      <text x="65" y="91" text-anchor="middle" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">SUCCESS (42s)</text>
    </g>

    <!-- Task 3: Circuit Breaker Gate -->
    <g transform="translate(400, 40)">
      <rect width="130" height="100" rx="10" fill="#090D16" stroke="#F59E0B" stroke-width="1.5"/>
      <rect x="10" y="10" width="110" height="20" rx="4" fill="#D97706" fill-opacity="0.2"/>
      <text x="65" y="24" text-anchor="middle" fill="#FBBF24" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">GATE: QUALITY</text>
      
      <text x="65" y="55" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Circuit Breaker</text>
      <text x="65" y="70" text-anchor="middle" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="9">Schema Drift Test</text>

      <rect x="25" y="80" width="80" height="15" rx="7" fill="#10B981" fill-opacity="0.2"/>
      <text x="65" y="91" text-anchor="middle" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">PASSED</text>
    </g>

    <!-- Task 4: dbt Transformation Run -->
    <g transform="translate(600, 40)">
      <rect width="130" height="100" rx="10" fill="#090D16" stroke="#38BDF8" stroke-width="2"/>
      <rect x="10" y="10" width="110" height="20" rx="4" fill="#0284C7" fill-opacity="0.2"/>
      <text x="65" y="24" text-anchor="middle" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">TASK 4: TRANSFORM</text>
      
      <text x="65" y="55" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="600">dbt Build Marts</text>
      <text x="65" y="70" text-anchor="middle" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="9">Incremental Load</text>

      <rect x="25" y="80" width="80" height="15" rx="7" fill="#38BDF8" fill-opacity="0.2"/>
      <text x="65" y="91" text-anchor="middle" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">RUNNING...</text>
    </g>

    <!-- Failure Alert Branch -->
    <path d="M 465 140 L 465 180 L 530 180" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="3,3"/>
    <g transform="translate(540, 160)">
      <rect width="130" height="40" rx="8" fill="#1E1B2E" stroke="#EF4444" stroke-width="1"/>
      <text x="65" y="20" text-anchor="middle" fill="#F87171" font-family="'Inter', sans-serif" font-size="10" font-weight="600">On Failure Alert</text>
      <text x="65" y="32" text-anchor="middle" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="8">Slack Webhook Dispatch</text>
    </g>
  </g>

  <!-- Bottom Metric Pill Strip -->
  <g transform="translate(40, 355)">
    <rect width="720" height="65" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    
    <g transform="translate(50, 22)">
      <text x="0" y="12" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10" text-transform="uppercase">ORCHESTRATED DAGS</text>
      <text x="0" y="32" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="14" font-weight="700">30+ Automated DAGs</text>
    </g>

    <line x1="240" y1="12" x2="240" y2="52" stroke="#1E293B" stroke-width="1"/>

    <g transform="translate(290, 22)">
      <text x="0" y="12" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10" text-transform="uppercase">TASK EXECUTION RATE</text>
      <text x="0" y="32" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">5,000+ Tasks / Day</text>
    </g>

    <line x1="490" y1="12" x2="490" y2="52" stroke="#1E293B" stroke-width="1"/>

    <g transform="translate(540, 22)">
      <text x="0" y="12" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10" text-transform="uppercase">INCIDENT DETECTION</text>
      <text x="0" y="32" fill="#818CF8" font-family="'Inter', sans-serif" font-size="14" font-weight="700">&lt; 60 Seconds</text>
    </g>
  </g>
</svg>

