<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Blueprint Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.6"/>
      <circle cx="0" cy="0" r="1" fill="#38BDF8" fill-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="450" fill="url(#bgGrad1)"/>
  <rect width="800" height="450" fill="url(#gridPattern)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="225" r="140" fill="#38BDF8" fill-opacity="0.03"/>
  <circle cx="600" cy="225" r="150" fill="#818CF8" fill-opacity="0.03"/>

  <!-- Pipeline Header Bar -->
  <g transform="translate(40, 30)">
    <rect width="720" height="44" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
    <circle cx="25" cy="22" r="5" fill="#EF4444"/>
    <circle cx="42" cy="22" r="5" fill="#F59E0B"/>
    <circle cx="59" cy="22" r="5" fill="#10B981"/>
    <text x="85" y="27" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500">pipeline_dag://enterprise_lakehouse_orchestration.py</text>
    <rect x="580" y="11" width="125" height="22" rx="11" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
    <text x="642" y="26" text-anchor="middle" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">STATE: SUCCESS</text>
  </g>

  <!-- Connected Pipeline Stream Lines -->
  <g fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6,6">
    <path d="M 180 230 L 260 230" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="none"/>
    <path d="M 380 230 L 440 230" stroke="#818CF8" stroke-width="2.5" stroke-dasharray="none"/>
    <path d="M 560 230 L 620 230" stroke="#10B981" stroke-width="2.5" stroke-dasharray="none"/>
  </g>

  <!-- Flow Direction Arrows -->
  <polygon points="255,226 265,230 255,234" fill="#38BDF8"/>
  <polygon points="435,226 445,230 435,234" fill="#818CF8"/>
  <polygon points="615,226 625,230 615,234" fill="#10B981"/>

  <!-- Stage 1: INGESTION (Sources) -->
  <g transform="translate(60, 130)">
    <rect width="120" height="200" rx="12" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.8"/>
    <rect x="15" y="18" width="90" height="24" rx="6" fill="#0284C7" fill-opacity="0.2"/>
    <text x="60" y="34" text-anchor="middle" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="11" font-weight="700">1. INGESTION</text>
    
    <!-- Source Items -->
    <rect x="15" y="60" width="90" height="34" rx="6" fill="#090D16" stroke="#334155" stroke-width="1"/>
    <text x="60" y="82" text-anchor="middle" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11">OLTP MySQL</text>

    <rect x="15" y="105" width="90" height="34" rx="6" fill="#090D16" stroke="#334155" stroke-width="1"/>
    <text x="60" y="127" text-anchor="middle" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11">REST APIs</text>

    <rect x="15" y="150" width="90" height="34" rx="6" fill="#090D16" stroke="#334155" stroke-width="1"/>
    <text x="60" y="172" text-anchor="middle" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11">Kafka Stream</text>
  </g>

  <!-- Stage 2: BRONZE LAYER (Raw S3) -->
  <g transform="translate(260, 130)">
    <rect width="120" height="200" rx="12" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.8"/>
    <rect x="15" y="18" width="90" height="24" rx="6" fill="#D97706" fill-opacity="0.2"/>
    <text x="60" y="34" text-anchor="middle" fill="#FBBF24" font-family="'Inter', sans-serif" font-size="11" font-weight="700">2. BRONZE</text>

    <!-- S3 Bucket / Storage Icon -->
    <g transform="translate(35, 65)">
      <ellipse cx="25" cy="15" rx="25" ry="10" fill="#F59E0B" fill-opacity="0.3" stroke="#F59E0B" stroke-width="1.5"/>
      <path d="M 0 15 L 0 55 A 25 10 0 0 0 50 55 L 50 15" fill="#F59E0B" fill-opacity="0.1" stroke="#F59E0B" stroke-width="1.5"/>
      <ellipse cx="25" cy="35" rx="25" ry="10" fill="none" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="3,3"/>
      <ellipse cx="25" cy="55" rx="25" ry="10" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
    </g>

    <text x="60" y="160" text-anchor="middle" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12" font-weight="600">AWS S3 Lake</text>
    <text x="60" y="180" text-anchor="middle" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">Parquet / Snappy</text>
  </g>

  <!-- Stage 3: SILVER LAYER (dbt Conformance) -->
  <g transform="translate(440, 130)">
    <rect width="120" height="200" rx="12" fill="url(#cardGrad)" stroke="#818CF8" stroke-width="1.5" stroke-opacity="0.8"/>
    <rect x="15" y="18" width="90" height="24" rx="6" fill="#4F46E5" fill-opacity="0.2"/>
    <text x="60" y="34" text-anchor="middle" fill="#818CF8" font-family="'Inter', sans-serif" font-size="11" font-weight="700">3. SILVER</text>

    <!-- dbt Transform Visual -->
    <rect x="15" y="65" width="90" height="55" rx="8" fill="#090D16" stroke="#6366F1" stroke-width="1"/>
    <text x="60" y="90" text-anchor="middle" fill="#A5B4FC" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">dbt Core</text>
    <text x="60" y="108" text-anchor="middle" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9">Cleaning & Dedupe</text>

    <rect x="15" y="135" width="90" height="40" rx="6" fill="#090D16" stroke="#10B981" stroke-width="1"/>
    <text x="60" y="152" text-anchor="middle" fill="#34D399" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Schema Gates</text>
    <text x="60" y="166" text-anchor="middle" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9">100% Unique/Nulls</text>
  </g>

  <!-- Stage 4: GOLD LAYER (Star Schema Analytics) -->
  <g transform="translate(620, 130)">
    <rect width="120" height="200" rx="12" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.8"/>
    <rect x="15" y="18" width="90" height="24" rx="6" fill="#059669" fill-opacity="0.2"/>
    <text x="60" y="34" text-anchor="middle" fill="#34D399" font-family="'Inter', sans-serif" font-size="11" font-weight="700">4. GOLD MARTS</text>

    <!-- PostgreSQL Star Schema Cylinder -->
    <g transform="translate(35, 60)">
      <ellipse cx="25" cy="12" rx="25" ry="8" fill="#10B981" fill-opacity="0.3" stroke="#10B981" stroke-width="1.5"/>
      <path d="M 0 12 L 0 45 A 25 8 0 0 0 50 45 L 50 12" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-width="1.5"/>
      <ellipse cx="25" cy="45" rx="25" ry="8" fill="none" stroke="#10B981" stroke-width="1.5"/>
    </g>

    <text x="60" y="145" text-anchor="middle" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12" font-weight="600">PostgreSQL DWH</text>
    <text x="60" y="162" text-anchor="middle" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10">Star Schema</text>
    <text x="60" y="180" text-anchor="middle" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">Power BI Ready</text>
  </g>

  <!-- Bottom Metric Pill Strip -->
  <g transform="translate(40, 360)">
    <rect width="720" height="60" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    
    <g transform="translate(50, 20)">
      <text x="0" y="12" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10" text-transform="uppercase">ORCHESTRATOR</text>
      <text x="0" y="30" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Apache Airflow 2.8</text>
    </g>

    <line x1="240" y1="12" x2="240" y2="48" stroke="#1E293B" stroke-width="1"/>

    <g transform="translate(290, 20)">
      <text x="0" y="12" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10" text-transform="uppercase">THROUGHPUT VOLUME</text>
      <text x="0" y="30" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">2.5M+ Rows / Day</text>
    </g>

    <line x1="490" y1="12" x2="490" y2="48" stroke="#1E293B" stroke-width="1"/>

    <g transform="translate(540, 20)">
      <text x="0" y="12" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10" text-transform="uppercase">QUERY PERFORMANCE</text>
      <text x="0" y="30" fill="#818CF8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">45% Latency Drop</text>
    </g>
  </g>
</svg>

