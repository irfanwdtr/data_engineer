<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="ogCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <filter id="ogGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <pattern id="ogGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.4"/>
      <circle cx="0" cy="0" r="1.5" fill="#38BDF8" fill-opacity="0.3"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#ogBg)"/>
  <rect width="1200" height="630" fill="url(#ogGrid)"/>

  <!-- Glowing Light Orbs -->
  <circle cx="1000" cy="200" r="280" fill="#38BDF8" fill-opacity="0.08" filter="url(#ogGlow)"/>
  <circle cx="200" cy="500" r="260" fill="#818CF8" fill-opacity="0.08" filter="url(#ogGlow)"/>

  <!-- Left Content -->
  <g transform="translate(100, 110)">
    <!-- Brand / Status Pill -->
    <rect width="280" height="38" rx="19" fill="#0B132B" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.8"/>
    <circle cx="24" cy="19" r="5" fill="#10B981"/>
    <text x="42" y="24" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">DATA ENGINEER PORTFOLIO</text>

    <!-- Headline -->
    <text x="0" y="110" fill="#FFFFFF" font-family="'Inter', system-ui, sans-serif" font-size="64" font-weight="900" letter-spacing="-1.5">
      Irfan Widiantoro
    </text>

    <!-- Subtitle -->
    <text x="0" y="170" fill="url(#ogCyan)" font-family="'JetBrains Mono', monospace" font-size="32" font-weight="700">
      &gt; Data Engineer &amp; Platform Architect
    </text>

    <!-- Description -->
    <text x="0" y="230" fill="#94A3B8" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="400">
      Designing resilient ETL/ELT pipelines, dimensional data lakes,
    </text>
    <text x="0" y="265" fill="#94A3B8" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="400">
      and automated cloud data infrastructure.
    </text>

    <!-- Stack Badges -->
    <g transform="translate(0, 320)">
      <rect x="0" y="0" width="105" height="38" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="52" y="24" text-anchor="middle" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600">Python</text>

      <rect x="120" y="0" width="80" height="38" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="160" y="24" text-anchor="middle" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600">SQL</text>

      <rect x="215" y="0" width="170" height="38" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="300" y="24" text-anchor="middle" fill="#818CF8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600">Apache Airflow</text>

      <rect x="400" y="0" width="75" height="38" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="437" y="24" text-anchor="middle" fill="#818CF8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600">dbt</text>

      <rect x="490" y="0" width="135" height="38" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="557" y="24" text-anchor="middle" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600">PostgreSQL</text>

      <rect x="640" y="0" width="85" height="38" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="682" y="24" text-anchor="middle" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600">AWS</text>

      <rect x="740" y="0" width="100" height="38" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="790" y="24" text-anchor="middle" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600">Docker</text>
    </g>
  </g>

  <!-- Right Side Terminal Graphic Card -->
  <g transform="translate(820, 110)">
    <rect width="280" height="380" rx="16" fill="#090D16" stroke="#1E293B" stroke-width="2" filter="url(#ogGlow)"/>
    <rect width="280" height="36" rx="16" fill="#1E293B"/>
    <circle cx="20" cy="18" r="5" fill="#EF4444"/>
    <circle cx="35" cy="18" r="5" fill="#F59E0B"/>
    <circle cx="50" cy="18" r="5" fill="#10B981"/>
    <text x="75" y="23" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">airflow_dag_live.py</text>

    <!-- Node Steps -->
    <g transform="translate(20, 60)">
      <rect width="240" height="50" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
      <text x="15" y="24" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11">extract_bronze_lake</text>
      <text x="15" y="40" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="10">SUCCESS [2.5M rows]</text>

      <rect y="65" width="240" height="50" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
      <text x="15" y="89" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11">dbt_run_silver_marts</text>
      <text x="15" y="105" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="10">PASSED [120 tests]</text>

      <rect y="130" width="240" height="50" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
      <text x="15" y="154" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11">fct_transactions_gold</text>
      <text x="15" y="170" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10">RUNNING [Star Schema]</text>

      <rect y="195" width="240" height="50" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" opacity="0.6"/>
      <text x="15" y="219" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">powerbi_cache_warm</text>
      <text x="15" y="235" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10">QUEUED</text>
    </g>

    <!-- Bottom Metric -->
    <text x="140" y="345" text-anchor="middle" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">99.9% PIPELINE SLA</text>
  </g>
</svg>

